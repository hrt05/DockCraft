services:
  mc:
    build:
      # Dockerfileがある場所
      context: .
      args:
        SERVER_JAR_URL: "https://piston-data.mojang.com/v1/objects/33680f5f2ac32864d6d7cf5e56a705fdb3e05f4c/server.jar"
    
    ports:
      - "25565:25565"
    
    # 消したくないやつ
    volumes:
      - ./data:/server

    # restartはコンテナの終了時に、プラットフォームが適用するポリシーを定義します。
    # unless-stopped ：コンテナの終了コードにかかわらず再起動しますが、サービスが停止もしくは削除する場合は再起動処理を行いません。
    restart: unless-stopped

    tty: true
    stdin_open: true
    